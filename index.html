<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- هذه الرؤوس ضرورية لعمل ffmpeg.wasm -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
  
  <title>مجهز ستوريات الواتساب الاحترافي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo">💬</span>
        <h1>مجهز ستوريات الواتساب الاحترافي</h1>
      </div>
      <p class="tagline">قص وتقسيم وتحويل لعمودي (9:16) مع محرك ضغط ذكي</p>
    </header>

    <section class="card upload-card">
      <label for="fileInput" class="dropzone" id="dropzone">
        <span class="dz-icon">📁</span>
        <span class="dz-title">اسحب الفيديو هنا أو اضغط للاختيار</span>
        <input type="file" id="fileInput" accept="video/*" hidden />
      </label>
      <div class="file-meta hidden" id="fileMeta">
        <strong id="fileName"></strong>
        <span id="fileSize"></span>
      </div>
    </section>

    <section class="card preview-section hidden" id="previewSection">
      <video id="previewVideo" controls></video>
    </section>

    <section class="card tool-pane hidden" id="panel-compress">
      <h2 class="pane-title">⚙️ اختر وضع التقسيم</h2>
      <div class="field">
        <div class="auto-split-grid" id="autoSplitList" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
          <button class="split-option" data-mode="60" style="padding: 10px;">مقطع دقيقة (720p)</button>
          <button class="split-option" data-mode="30" style="padding: 10px;">نصف مقطع (1080p)</button>
        </div>
      </div>
      <button class="btn primary" id="runCompress" style="width: 100%; margin-top: 15px; padding: 15px; background: #25D366; border: none; color: white; font-weight: bold; cursor: pointer;">🚀 معالجة الستوري</button>

      <div class="multi-result hidden" id="multiResult">
        <ul class="parts-list" id="partsList"></ul>
      </div>
    </section>

    <section class="card progress-card hidden" id="progressCard">
      <div id="progressLabel">جارٍ المعالجة…</div>
      <div class="progress-track"><div class="progress-bar" id="progressBar" style="height: 10px; background: #25D366; width: 0%;"></div></div>
      <p class="error hidden" id="errorBox"></p>
    </section>
  </div>

  <script>
    // حل مشكلة SharedArrayBuffer
    if (!window.crossOriginIsolated) {
      console.warn("المتصفح ليس في وضع العزل (Cross-Origin Isolated). ffmpeg قد لا يعمل.");
    }
  </script>
  <script src="js/main.js"></script>
</body>
</html>
